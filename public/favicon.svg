<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="cakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="64" height="64" rx="16" fill="url(#cakeGrad)" />

  <!-- Cake Base Stand -->
  <path d="M 14 48 L 50 48 L 46 52 L 18 52 Z" fill="url(#goldGrad)" opacity="0.9"/>

  <!-- Cake Layer 1 (Bottom) -->
  <rect x="16" y="34" width="32" height="13" rx="3" fill="#FFFFFF" opacity="0.95"/>
  <path d="M 16 38 C 20 41, 24 35, 28 38 C 32 41, 36 35, 40 38 C 44 41, 48 35, 48 38 L 48 40 C 44 37, 40 43, 36 40 C 32 37, 28 43, 24 40 C 20 37, 16 40, 16 40 Z" fill="#F43F5E"/>

  <!-- Cake Layer 2 (Top Layer) -->
  <rect x="20" y="24" width="24" height="11" rx="2.5" fill="#FFF1F2"/>
  <path d="M 20 27 C 23 29.5, 26 25, 29 27.5 C 32 30, 35 25, 38 27.5 C 41 30, 44 26, 44 27 L 44 29 C 41 27.5, 38 31, 35 29 C 32 27, 29 30.5, 26 29 C 23 27.5, 20 29, 20 29 Z" fill="#E11D48"/>

  <!-- Frosting Swirls -->
  <circle cx="24" cy="22" r="2.5" fill="#FFFFFF"/>
  <circle cx="32" cy="21" r="3" fill="#FFFFFF"/>
  <circle cx="40" cy="22" r="2.5" fill="#FFFFFF"/>

  <!-- Cherry / Candle -->
  <circle cx="32" cy="15" r="3.5" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <path d="M 32 11 Q 35 7, 38 8" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Sparkle Stars -->
  <path d="M 13 16 L 14.5 13 L 17.5 11.5 L 14.5 10 L 13 7 L 11.5 10 L 8.5 11.5 L 11.5 13 Z" fill="#FBBF24"/>
  <path d="M 49 20 L 50 18 L 52 17 L 50 16 L 49 14 L 48 16 L 46 17 L 48 18 Z" fill="#FBBF24" opacity="0.85"/>
</svg>
